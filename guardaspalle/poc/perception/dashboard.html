<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Guardaspalle</title>
<style>
  :root {
    --bg: #05070a; --panel: #0d1218; --fg: #e8edf2; --muted: #7d8896;
    --green: #2fd27a; --amber: #ffb020; --red: #ff3b3b; --lane: #3a4554;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); }
  #banner { margin: 10px 12px 0; padding: 12px 14px; border-radius: 14px; background: var(--panel);
    font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; min-height: 58px;
    transition: background .2s, color .2s; }
  #banner .sub { font-size: 15px; font-weight: 500; opacity: .85; margin-left: auto; white-space: nowrap; }
  #banner.ok { color: var(--green); }
  #banner.l1 { background: var(--amber); color: #1b1200; }
  #banner.l2 { background: var(--red); color: #fff; animation: blink .5s steps(2) infinite; }
  #banner.off { color: var(--muted); }
  #zones { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 12px 4px; }
  .zone { text-align: center; font-size: 12px; color: var(--muted); }
  .zone i { display: block; height: 12px; border-radius: 6px; background: #1a222c; margin-bottom: 4px;
    transition: background .15s; }
  .zone.l1 i { background: var(--amber); }
  .zone.l2 i { background: var(--red); animation: blink .4s steps(2) infinite; }
  .zone.deg i { background: repeating-linear-gradient(90deg, #4a3a10 0 8px, #1a222c 8px 16px); }
  #wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .6s; }
  body.calm canvas { opacity: .3; }
  body.calm #zones { opacity: .5; }
  #toast { position: absolute; left: 12px; right: 12px; bottom: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(13, 18, 24, .92); border: 1px solid #263140; font-size: 15px; display: none; }
  #toast.bad { border-color: var(--red); }
  #toast.good { border-color: var(--green); }
  #foot { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px;
    padding: 6px 12px calc(8px + env(safe-area-inset-bottom)); }
  #foot b { color: var(--fg); font-weight: 600; }
  #fall { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(160, 0, 0, .92); color: #fff; font-size: 26px; font-weight: 800; text-align: center; padding: 24px; }
  #fall small { font-size: 16px; font-weight: 500; }
  #tap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(5, 7, 10, .9); font-size: 20px; text-align: center; padding: 24px; }
  #tap small { color: var(--muted); font-size: 14px; max-width: 320px; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>
<body>
<div id="app">
  <div id="banner" class="off"><span id="btext">In attesa del Raspberry…</span><span class="sub" id="bsub"></span></div>
  <div id="zones">
    <div class="zone" id="zL"><i></i>SINISTRA</div>
    <div class="zone" id="zB"><i></i>DIETRO</div>
    <div class="zone" id="zR"><i></i>DESTRA</div>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="foot"></div>
</div>
<div id="fall"><div id="ftext">Caduta rilevata</div><small id="fsub"></small></div>
<div id="tap"><div>Tocca per iniziare</div>
  <small>Attiva il suono, tiene acceso lo schermo e, se il browser lo permette, manda la posizione GPS agli eventi.</small></div>

<script>
const $ = (id) => document.getElementById(id);
const EMOJI = { auto: "🚗", bus: "🚌", camion: "🚚", moto: "🏍️", bici: "🚲", persona: "🚶" };
const COL = ["#8a96a6", "#ffb020", "#ff3b3b"];
const SIDE = { L: "A SINISTRA", B: "DIETRO DI TE", R: "A DESTRA" };
const MAX_D = 35;

let S = null, lastOk = 0, quietSince = performance.now();
let audio = null, beepAt = 0, gpsMsg = "GPS —";
let lastPassT = 0, lastLookT = 0, toastUntil = 0;
const objs = new Map();

// ---------------------------------------------------------------- dati dal Raspberry
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    S = await r.json();
    lastOk = performance.now();
    onState();
  } catch (e) { /* riprova */ }
  setTimeout(poll, 100);
}

function onState() {
  const lp = S.last_pass;
  if (lp && lp.t !== lastPassT) {
    lastPassT = lp.t;
    const m = (lp.cm / 100).toFixed(2);
    const pred = lp.pred != null ? ` · previsto ${lp.pred.toFixed(2)} m` : "";
    toast(`Sorpasso: ${EMOJI[lp.veicolo] || ""} ${m} m${pred}`, lp.cm / 100 < S.pass_safe ? "bad" : "good", 5000);
  }
  const lk = S.helmet && S.helmet.look;
  if (lk && lk.t !== lastLookT) {
    lastLookT = lk.t;
    toast(`Guardata ${lk.lato === "L" ? "a sinistra" : "a destra"}: ${lk.risposta === 2 ? "ROSSO, aspetta" : "verde, libero"}`,
      lk.risposta === 2 ? "bad" : "good", 3000);
  }
}

function toast(text, cls, ms) {
  const t = $("toast");
  t.textContent = text;
  t.className = cls || "";
  t.style.display = "block";
  toastUntil = performance.now() + ms;
}

// ---------------------------------------------------------------- testo, zone, suono
function updateUi(now) {
  const connected = S && now - lastOk < 1500;
  const banner = $("banner");
  const z = connected ? S.zones : { L: 0, B: 0, R: 0 };
  const max = Math.max(z.L, z.B, z.R);

  for (const k of ["L", "B", "R"]) {
    const el = $("z" + k);
    const blind = connected && !S.cam_ok && !(S.has_us && S.us_side === k);
    el.className = "zone" + (z[k] ? " l" + z[k] : "") + (blind && !z[k] ? " deg" : "");
  }

  if (!connected) {
    banner.className = "off"; $("btext").textContent = "Collegamento perso"; $("bsub").textContent = "";
  } else if (max === 2) {
    const side = z.L === 2 ? "L" : z.B === 2 ? "B" : "R";
    banner.className = "l2"; $("btext").textContent = "PERICOLO " + SIDE[side];
    $("bsub").textContent = S.top ? `${EMOJI[S.top.cls] || ""} ${S.top.ttc != null ? S.top.ttc.toFixed(1) + " s" : ""}` : "di fianco";
  } else if (max === 1) {
    banner.className = "l1"; $("btext").textContent = "Attenzione";
    $("bsub").textContent = S.top ? `${EMOJI[S.top.cls] || ""} in arrivo ${S.top.ttc != null ? S.top.ttc.toFixed(1) + " s" : ""}` : "vicino a te";
  } else if (!S.cam_ok) {
    banner.className = "l1"; $("btext").textContent = "Camera assente"; $("bsub").textContent = "solo ultrasuono";
  } else {
    banner.className = "ok"; $("btext").textContent = "Strada libera"; $("bsub").textContent = "";
  }

  if (max > 0 || !connected) quietSince = now;
  document.body.classList.toggle("calm", now - quietSince > 3000);

  if (max === 2 && audio && now > beepAt) { beep(z.B === 2 ? 1500 : 2400); beepAt = now + 320; }
  if (now > toastUntil) $("toast").style.display = "none";

  const fall = connected && S.helmet && S.helmet.fall;
  const fallAge = fall ? S.t - fall.t : 1e9;  // orologio del Pi, non del telefono
  const showFall = fall && fall.fase > 0 && fallAge < 60;
  $("fall").style.display = showFall ? "flex" : "none";
  if (showFall) {
    $("ftext").textContent = fall.fase === 2 ? "SOS inviato" : "Caduta rilevata";
    $("fsub").textContent = fall.fase === 2 ? "Messaggio partito ai contatti" : "Premi \"sto bene\" sul casco entro 30 secondi";
  }

  if (connected) {
    const c = S.counts, h = S.helmet;
    $("foot").innerHTML = [
      `<b>${S.fps}</b> fps`, `<b>${S.lat_ms}</b> ms`, S.mode,
      `casco <b>${h.ok ? "✓" : "✗"}</b>`,
      S.has_us ? `ultrasuono <b>${S.us_cm != null ? (S.us_cm / 100).toFixed(2) + " m" : "libero"}</b>` : "ultrasuono —",
      `avvisi rossi <b>${c.rossi}</b> · radar <b>${c.radar}</b>`,
      `sorpassi <b>${c.sorpassi}</b> (stretti ${c.sorpassi_stretti})`,
      S.calib.mae_cm != null ? `previsto vs misurato: errore medio <b>${S.calib.mae_cm} cm</b>` : "",
      S.calib.n ? `calibrazione ×<b>${S.calib.k}</b> (${S.calib.n})` : "",
      S.gps ? "GPS <b>✓</b>" : gpsMsg,
    ].filter(Boolean).join("<span> · </span>");
  }
}

function beep(freq) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; o.type = "square";
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.12);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.13);
}

// ---------------------------------------------------------------- vista dall'alto
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

function geo() {
  const pxm = Math.min(W / 8, 70), cx = W / 2, bikeY = 54, span = H - bikeY - 40;
  return {
    pxm, cx, bikeY,
    x: (lat) => cx - lat * pxm,                                   // sinistra del ciclista = sinistra dello schermo
    y: (d) => bikeY + 26 + span * Math.sqrt(Math.max(0, Math.min(d, MAX_D)) / MAX_D),
    s: (d) => 1 - 0.45 * Math.sqrt(Math.max(0, Math.min(d, MAX_D)) / MAX_D),
  };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  updateUi(now);
  const g = geo();
  ctx.clearRect(0, 0, W, H);

  // strada: bordo destro, linea di mezzeria tratteggiata che scorre
  ctx.strokeStyle = "#566273"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g.x(-0.8), 0); ctx.lineTo(g.x(-0.8), H); ctx.stroke();
  ctx.strokeStyle = "#c9d2dc"; ctx.lineWidth = 3; ctx.setLineDash([22, 22]);
  ctx.lineDashOffset = -((now / 1000) * 60 % 44);
  ctx.beginPath(); ctx.moveTo(g.x(2.7), 0); ctx.lineTo(g.x(2.7), H); ctx.stroke();
  ctx.setLineDash([]);

  // bolla di sicurezza attorno alla bici (fino alla distanza di sorpasso sicura a sinistra)
  const zL = S && now - lastOk < 1500 ? S.zones.L : 0;
  const safe = S ? S.pass_safe : 1.5;
  ctx.fillStyle = zL === 2 ? "rgba(255,59,59,.18)" : zL === 1 ? "rgba(255,176,32,.12)" : "rgba(47,210,122,.08)";
  roundRect(g.x(safe), g.bikeY - 26, (safe + 0.45) * g.pxm, 120, 18); ctx.fill();

  // ultrasuono: distanza misurata ora
  if (S && S.us_cm != null) {
    const sideSign = S.us_side === "R" ? -1 : 1, m = S.us_cm / 100;
    ctx.strokeStyle = COL[S.near]; ctx.lineWidth = 4;
    ctx.fillStyle = COL[S.near]; ctx.font = "600 14px system-ui"; ctx.textAlign = "center";
    if (S.us_side === "B") {  // puntato indietro: linea verso il basso, come la camera
      ctx.beginPath(); ctx.moveTo(g.cx, g.bikeY + 26); ctx.lineTo(g.cx, g.y(m)); ctx.stroke();
      ctx.fillText(m.toFixed(2) + " m", g.cx + 34, g.y(m / 2));
    } else {
      ctx.beginPath(); ctx.moveTo(g.cx, g.bikeY + 6); ctx.lineTo(g.x(sideSign * m), g.bikeY + 6); ctx.stroke();
      ctx.fillText(m.toFixed(2) + " m", (g.cx + g.x(sideSign * m)) / 2, g.bikeY - 4);
    }
  }

  // veicoli, con posizioni interpolate (60 fps anche se YOLO va a 5-10)
  const seen = new Set();
  const alpha = 1 - Math.exp(-dt / 0.12);
  if (S && now - lastOk < 1500) {
    for (const t of S.tracks) {
      seen.add(t.id);
      const d = t.edge ? 1.0 : (t.d != null ? t.d : MAX_D);
      const lat = t.edge ? t.lat_pass : t.lat;
      const tx = g.x(lat), ty = g.y(d);
      let o = objs.get(t.id);
      if (!o) { o = { x: tx, y: ty, a: 0 }; objs.set(t.id, o); }
      o.x += (tx - o.x) * alpha; o.y += (ty - o.y) * alpha; o.a = Math.min(1, o.a + dt * 4);
      o.t = t; o.seen = now;
    }
  }
  for (const [id, o] of objs) {
    if (!seen.has(id)) { o.a -= dt * 3; if (o.a <= 0) { objs.delete(id); continue; } }
    drawVehicle(g, o);
  }

  // la bici
  ctx.save(); ctx.translate(g.cx, g.bikeY);
  ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineCap = "round";
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, 26); ctx.stroke();     // ruote e telaio
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-13, -14); ctx.lineTo(13, -14); ctx.stroke();  // manubrio
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2); ctx.fill();                     // spalle
  ctx.fillStyle = "#2fd27a"; ctx.beginPath(); ctx.arc(0, -3, 6, 0, Math.PI * 2); ctx.fill();    // casco
  ctx.restore();

  requestAnimationFrame(frame);
}

function drawVehicle(g, o) {
  const t = o.t, d = t.edge ? 1 : (t.d != null ? t.d : MAX_D), s = g.s(d);
  const w = Math.max(10, t.w * g.pxm * s), h = Math.max(14, t.len * g.pxm * s * 0.5);
  const col = COL[t.level];
  ctx.globalAlpha = Math.max(0, o.a) * (t.level ? 1 : 0.75);

  if (t.level >= 1 && !t.edge) {  // traiettoria prevista fino al punto di sorpasso
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(o.x, o.y - h / 2); ctx.lineTo(g.x(t.lat_pass), g.bikeY + 20); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.shadowColor = col; ctx.shadowBlur = t.level === 2 ? 24 : 0;
  ctx.fillStyle = "#151c25"; ctx.strokeStyle = col; ctx.lineWidth = t.level ? 3 : 2;
  roundRect(o.x - w / 2, o.y - h / 2, w, h, Math.min(10, w / 4)); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = `${Math.round(14 + 12 * s)}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(EMOJI[t.cls] || "•", o.x, o.y);
  if (t.level >= 1) {
    const parts = [];
    if (t.ttc != null) parts.push(t.ttc.toFixed(1) + " s");
    if (t.zone !== "B" && t.clear != null) parts.push("↔ " + t.clear.toFixed(1) + " m");
    ctx.fillStyle = col; ctx.font = "700 14px system-ui"; ctx.textBaseline = "top";
    ctx.fillText(parts.join("  "), o.x, o.y + h / 2 + 4);
  }
  ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
}

// ---------------------------------------------------------------- avvio: suono, schermo acceso, GPS
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* facoltativo */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

$("tap").addEventListener("click", () => {
  $("tap").style.display = "none";
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  keepAwake();
  if (!window.isSecureContext) {
    gpsMsg = "GPS: serve HTTPS (vedi README)";
  } else if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition((p) => {
      fetch("/gps", { method: "POST", body: JSON.stringify({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }) });
    }, (e) => { gpsMsg = "GPS: " + e.message; }, { enableHighAccuracy: true, maximumAge: 2000 });
  }
});

// ?auto nell'indirizzo: niente schermata iniziale (per il monitor della giuria; senza suono)
if (new URLSearchParams(location.search).has("auto")) $("tap").style.display = "none";

resize();
poll();
requestAnimationFrame(frame);
</script>
</body>
</html>
