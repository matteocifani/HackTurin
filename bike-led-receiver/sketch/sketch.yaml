profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Adafruit NeoPixel (1.15.5)
      - Arduino_Modulino (0.7.0)
      # Transitive deps of Arduino_Modulino: arduino-app-cli does not resolve them,
      # and Modulino.h includes all of them even if only Movement is used.
      - STM32duino VL53L4CD (1.0.5)
      - STM32duino VL53L4ED (1.0.1)
      - Arduino_LSM6DSOX (1.1.2)
      - Arduino_LPS22HB (1.0.2)
      - Arduino_HS300x (1.0.0)
      - ArduinoGraphics (1.1.5)
      - Arduino_LTR381RGB (1.0.1)
default_profile: default
